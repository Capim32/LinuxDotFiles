# Fundo (Tira print e desfoca)
background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 3
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Campo de Senha
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.1)
    inner_color = rgba(0, 0, 0, 0.4)
    font_color = rgb(200, 200, 200)

    # Esconde o campo da senha até que o usuário digite algo
    fade_on_empty = true
    placeholder_text = 

    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

# Relógio
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = JetBrains Mono Nerd Font Bold
    color = rgba(255, 255, 255, 1.0)
    position = 0, 80
    halign = center
    valign = center
}
