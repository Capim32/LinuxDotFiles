font_family      JetBrainsMono NF
bold_font        auto
italic_font      auto
bold_italic_font auto

background_opacity 0.9
dynamic_background_opacity yes

# cool cursor animation
cursor_trail 10
cursor_trail_start_thereshold 0
cursor_trail_decay 0.01 0.05
cursor_shape_block
cursor_blik true

# BEGIN_KITTY_THEME
# Base2Tone Drawbridge Dark (custom)
include current-theme.conf
# END_KITTY_THEME
